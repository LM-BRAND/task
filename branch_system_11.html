<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الفروع - LM BRAND</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #0f2057;
            --navy2: #1a3080;
            --gold: #c9a84c;
            --gold2: #e8c96d;
            --green: #16a34a;
            --red: #dc2626;
            --bg: #f0f4ff;
            --card: #ffffff;
            --border: #dde3f0;
            --text: #1a1f36;
            --muted: #6b7a9e;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }

        /* ===== HEADER ===== */
        .app-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(15,32,87,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--gold), var(--gold2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text h1 {
            color: white;
            font-size: 17px;
            font-weight: 800;
            line-height: 1.2;
        }

        .logo-text p {
            color: var(--gold2);
            font-size: 11px;
            font-weight: 500;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            text-align: left;
            display: none;
        }

        .user-badge .uname {
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        .user-badge .ubranch {
            color: var(--gold2);
            font-size: 11px;
        }

        .btn-logout {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 600;
            display: none;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.2);
        }

        .date-badge {
            background: rgba(201,168,76,0.2);
            border: 1px solid var(--gold);
            color: var(--gold2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* ===== LOGIN ===== */
        #loginScreen {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--card);
            border-radius: 20px;
            padding: 50px 45px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(15,32,87,0.12);
            border: 1px solid var(--border);
        }

        .login-card .lc-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-card .lc-title .lc-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--navy), var(--navy2));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
        }

        .login-card .lc-title h2 {
            color: var(--navy);
            font-size: 22px;
            font-weight: 800;
        }

        .login-card .lc-title p {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            background: #fafbff;
            transition: all 0.2s;
            direction: ltr;
            text-align: left;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--navy2);
            background: white;
            box-shadow: 0 0 0 4px rgba(26,48,128,0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(15,32,87,0.3);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #166534;
        }

        /* ===== DASHBOARDS ===== */
        .dashboard { display: none; }
        .dashboard.active { display: block; }

        /* ===== STATS ROW ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); }

        .stat-card .s-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .stat-card .s-val {
            font-size: 32px;
            font-weight: 800;
            color: var(--navy);
            line-height: 1;
            margin-bottom: 6px;
        }

        .stat-card .s-lbl {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card.green .s-val { color: var(--green); }
        .stat-card.gold .s-val { color: var(--gold); }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--navy);
            margin: 28px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        /* ===== PROCEDURE CARDS ===== */
        .procedures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 14px;
        }

        .proc-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            transition: all 0.25s;
            cursor: pointer;
        }

        .proc-card:hover {
            border-color: var(--navy2);
            box-shadow: 0 4px 16px rgba(26,48,128,0.1);
        }

        .proc-card.done {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .proc-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .proc-check {
            width: 26px;
            height: 26px;
            border: 2.5px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            transition: all 0.2s;
            background: white;
        }

        .proc-card.done .proc-check {
            background: var(--green);
            border-color: var(--green);
            color: white;
            font-size: 14px;
        }

        .proc-meta {
            flex: 1;
        }

        .proc-code {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .proc-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .proc-card.done .proc-title {
            text-decoration: line-through;
            color: var(--muted);
        }

        .proc-timing {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .proc-details {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .proc-details li {
            font-size: 12px;
            color: #555;
            line-height: 1.7;
            margin-right: 14px;
            list-style: disc;
        }

        /* Notes area */
        .proc-note-area {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .proc-note-area textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            font-family: 'Tajawal', sans-serif;
            color: var(--text);
            resize: none;
            background: #fafbff;
            transition: border-color 0.2s;
            direction: rtl;
        }

        .proc-note-area textarea:focus {
            outline: none;
            border-color: var(--navy2);
        }

        .note-save-btn {
            margin-top: 6px;
            padding: 6px 14px;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: auto;
        }

        .note-save-btn:hover { background: var(--navy2); }

        /* ===== BRANCH CARDS (Director) ===== */
        .branches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .branch-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.25s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .branch-card:hover {
            border-color: var(--navy2);
            box-shadow: 0 8px 24px rgba(26,48,128,0.1);
            transform: translateY(-2px);
        }

        .branch-head {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .branch-head .bname {
            color: white;
            font-size: 16px;
            font-weight: 800;
        }

        .branch-head .bpct {
            background: rgba(201,168,76,0.25);
            color: var(--gold2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--gold);
        }

        .branch-body {
            padding: 18px 20px;
        }

        .prog-bar-wrap {
            background: var(--border);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .prog-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--navy2), var(--gold));
            border-radius: 6px;
            transition: width 0.6s ease;
        }

        .branch-mini-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .bms {
            background: var(--bg);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }

        .bms-val {
            font-size: 20px;
            font-weight: 800;
            color: var(--navy);
        }

        .bms-lbl {
            font-size: 10px;
            color: var(--muted);
            font-weight: 600;
            margin-top: 3px;
        }

        /* Tasks detail per branch */
        .branch-tasks-toggle {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .tasks-toggle-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--navy);
            font-family: 'Tajawal', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            width: auto;
            transition: all 0.2s;
        }

        .tasks-toggle-btn:hover {
            background: var(--bg);
            border-color: var(--navy2);
        }

        .branch-task-list {
            display: none;
            margin-top: 12px;
        }

        .branch-task-list.open { display: block; }

        .btask-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 12px;
        }

        .btask-row:last-child { border-bottom: none; }

        .btask-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .btask-dot.done { background: var(--green); }
        .btask-dot.pending { background: #e5e7eb; border: 2px solid #d1d5db; }

        .btask-name { flex: 1; color: var(--text); }
        .btask-note { color: var(--muted); font-style: italic; font-size: 11px; }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,32,87,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            display: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--gold2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== REALTIME BADGE ===== */
        .realtime-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: var(--green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .rt-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--navy);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            z-index: 9999;
            transition: transform 0.3s ease;
            border: 1px solid var(--gold);
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ===== TABS ===== */
        .tabs-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--border);
            width: fit-content;
        }

        .tab-btn {
            padding: 9px 20px;
            border: none;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: var(--muted);
            transition: all 0.2s;
            width: auto;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--navy), var(--navy2));
            color: white;
            box-shadow: 0 4px 12px rgba(15,32,87,0.2);
        }

        .tab-btn:hover:not(.active) {
            background: var(--bg);
            color: var(--navy);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .app-header { padding: 14px 16px; }
            .main { padding: 16px 12px; }
            .login-card { padding: 30px 20px; }
            .procedures-grid { grid-template-columns: 1fr; }
            .branches-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<div class="app-header">
    <div class="app-logo">
        <div class="logo-icon">🏪</div>
        <div class="logo-text">
            <h1>نظام متابعة الفروع</h1>
            <p>LM BRAND — ضي العراق</p>
        </div>
    </div>
    <div class="header-user">
        <div class="date-badge" id="dateBadge"></div>
        <div class="user-badge" id="userBadge">
            <div class="uname" id="headerUserName"></div>
            <div class="ubranch" id="headerUserBranch"></div>
        </div>
        <button class="btn-logout" id="logoutBtn" onclick="logout()">خروج</button>
    </div>
</div>

<!-- Main -->
<div class="main">

    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="login-card">
            <div class="lc-title">
                <div class="lc-icon">🔐</div>
                <h2>تسجيل الدخول</h2>
                <p>أدخل بياناتك للوصول إلى النظام</p>
            </div>
            <div class="alert alert-error" id="loginError"></div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"
                    onkeydown="if(event.key==='Enter') doLogin()">
            </div>
            <button class="btn-primary" id="loginBtn" onclick="doLogin()">دخول</button>
        </div>
    </div>

    <!-- MANAGER DASHBOARD -->
    <div class="dashboard" id="managerDashboard">
        <div class="stats-row" id="mgr-stats"></div>

        <!-- Daily Report Button -->
        <div style="margin-bottom:20px;">
            <button onclick="openDailyReport()" style="background:linear-gradient(135deg,#c9a84c,#e8c96d);color:#0f2057;border:none;padding:12px 24px;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:800;cursor:pointer;width:auto;box-shadow:0 4px 14px rgba(201,168,76,0.35);display:flex;align-items:center;gap:8px;">
                ✉️ إرسال التقرير اليومي
            </button>
        </div>

        <!-- Report Modal -->
        <div id="reportModal" style="display:none;position:fixed;inset:0;background:rgba(15,32,87,0.7);z-index:500;align-items:center;justify-content:center;padding:20px;">
            <div style="background:white;border-radius:20px;padding:30px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
                    <h2 style="color:#0f2057;font-size:18px;font-weight:800;">📋 التقرير اليومي</h2>
                    <button onclick="closeReport()" style="background:#f0f4ff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:'Tajawal',sans-serif;font-weight:700;color:#6b7a9e;width:auto;">✕ إغلاق</button>
                </div>

                <!-- Report fields -->
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div>
                        <label style="display:block;font-size:13px;font-weight:700;color:#1a1f36;margin-bottom:6px;">📊 المبيعات اليوم</label>
                        <input id="rep_sales" type="text" placeholder="مثال: 850,000 د.ع — هدف 1,000,000 د.ع" style="width:100%;padding:11px 14px;border:2px solid #dde3f0;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;direction:rtl;">
                    </div>
                    <div>
                        <label style="display:block;font-size:13px;font-weight:700;color:#1a1f36;margin-bottom:6px;">✅ أبرز الإنجازات</label>
                        <textarea id="rep_achievements" rows="3" placeholder="اكتب أبرز ما تم إنجازه اليوم..." style="width:100%;padding:11px 14px;border:2px solid #dde3f0;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:13px;direction:rtl;resize:none;"></textarea>
                    </div>

function showLoading(v) { document.getElementById('loadingOverlay').style.display = v ? 'flex' : 'none'; }

function showToast(msg, dur = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
}

function formatDateAr(d) {
    return new Date(d).toLocaleDateString('ar-IQ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

// ============ AUTH ============
async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    err.style.display = 'none';
    if (!email || !password) {
        err.textContent = '⚠️ يرجى إدخال البريد وكلمة المرور';
        err.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'جاري التحقق...';
    showLoading(true);

    try {
        const { data: auth, error: ae } = await sb.auth.signInWithPassword({ email, password });
        if (ae) throw new Error('البريد أو كلمة المرور غير صحيحة');

        const { data: user, error: ue } = await sb.from('users').select('*').eq('email', email).single();
        if (ue || !user) throw new Error('لم يتم العثور على بيانات المستخدم');

        currentUser = user;
        localStorage.setItem('lm_user', JSON.stringify(user));
        showDashboard();
    } catch (e) {
        err.textContent = '❌ ' + e.message;
        err.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.textContent = 'دخول';
        showLoading(false);
    }
}

async function logout() {
    await sb.auth.signOut();
    localStorage.removeItem('lm_user');
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('managerDashboard').classList.remove('active');
    document.getElementById('directorDashboard').classList.remove('active');
    document.getElementById('userBadge').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
}

        const saved = localStorage.getItem('lm_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            showDashboard();

});

// Get date key per tab type
function getDateKey(tab) {
    const now = new Date();
    if (tab === 'daily') {
        return now.toISOString().split('T')[0];
    } else if (tab === 'weekly') {
        // Start of current week (Sunday)
        const day = now.getDay();
        const diff = now.getDate() - day;
        const weekStart = new Date(now.setDate(diff));
        return weekStart.toISOString().split('T')[0];
    } else {
        // Start of current month
        return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    }
}

async function toggleTask(code, index, dateKey) {
    const card = document.getElementById(`pc-${index}`);
    const isDone = card.classList.contains('done');

    try {
        if (isDone) {
            await sb.from('task_completions')
                .delete()
                .eq('branch', currentUser.branch)
                .eq('procedure_code', code)
                .eq('completion_date', dateKey);
            showToast('تم إلغاء الإنجاز');
        } else {
            const note = document.getElementById(`note-${index}`)?.value || '';
            await sb.from('task_completions').upsert({
                user_email: currentUser.email,
                branch: currentUser.branch,
                procedure_code: code,
                completion_date: dateKey,
                note: note
            }, { onConflict: 'branch,procedure_code,completion_date' });
            showToast('✅ تم تسجيل الإنجاز');
        }
        await loadManagerDashboard();
    } catch(e) {
        showToast('❌ حدث خطأ');
        console.error(e);
    }
}

async function saveNote(code, index, dateKey) {
    const note = document.getElementById(`note-${index}`)?.value || '';
    try {
        await sb.from('task_completions').upsert({
            user_email: currentUser.email,
            branch: currentUser.branch,
            procedure_code: code,
            completion_date: dateKey,
            note: note
        }, { onConflict: 'branch,procedure_code,completion_date' });
        showToast('💾 تم حفظ الملاحظة');
    } catch(e) {
        showToast('❌ خطأ في الحفظ');
    }
}

async function loadDirectorDashboard() {
    showLoading(true);
    try {
        const picker = document.getElementById('dirDatePicker');
        const selectedDate = picker ? (picker.value || todayDate) : todayDate;
        const isToday = selectedDate === todayDate;

        // Update section title
        const titleEl = document.getElementById('dir-section-title');
        if (titleEl) {
            const dateLabel = new Date(selectedDate + 'T00:00:00').toLocaleDateString('ar-IQ', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
            titleEl.textContent = isToday ? '🏢 أداء الفروع — اليوم' : `🏢 أداء الفروع — ${dateLabel}`;
        }

        const { data: completions } = await sb
            .from('task_completions')
            .select('*')
            .eq('completion_date', selectedDate);

        const all = completions || [];

        // Build branch map
        const branchMap = {};
        BRANCHES.forEach(b => { branchMap[b] = { done: [], map: {} }; });
        all.forEach(r => {
            if (branchMap[r.branch]) {
                branchMap[r.branch].done.push(r);
                branchMap[r.branch].map[r.procedure_code] = r;
            }
        });

        const allProcs = [...PROCEDURES.daily, ...PROCEDURES.weekly, ...PROCEDURES.monthly];
        const total = PROCEDURES.daily.length; // daily only for today view
        let grandDone = 0;
        let grandTotal = BRANCHES.length * total;
        BRANCHES.forEach(b => { grandDone += branchMap[b].done.length; });
        const overallPct = Math.round((grandDone / grandTotal) * 100);

        // All done branches
        const fullBranches = BRANCHES.filter(b => branchMap[b].done.length >= total).length;

        // Load targets for selected date
        const { data: targetsData } = await sb
            .from('sales_targets')
            .select('*')
            .eq('target_date', selectedDate);

        // Stats

                <div class="s-val">${fullBranches}</div>
                <div class="s-lbl">فروع مكتملة</div>

        `;

        // Branches
        let html = '';
        BRANCHES.forEach(branch => {
            const bdata = branchMap[branch];
            const done = bdata.done.length;
            const pct = Math.round((done / total) * 100);
            const tgt = targetsMap[branch];

            let targetSection = '';
            if (tgt) {
                const fmt = Number(tgt.total_target).toLocaleString('ar-IQ');
                const empRows = tgt.employees && tgt.employees.length > 0
                    ? tgt.employees.map(e => `<div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid #f0f0f0;"><span>👤 ${e.name}</span><span style="color:#c9a84c;font-weight:700;">${e.target} قطعة — ${e.achieved ? '✅ حقق' : '⏳ لم يحقق'}</span></div>`).join('')
                    : '';
                targetSection = `

                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">

async function getReportData() {
    const sales        = document.getElementById('rep_sales').value.trim();
    const achievements = document.getElementById('rep_achievements').value.trim();
    const issues       = document.getElementById('rep_issues').value.trim();
    const team         = document.getElementById('rep_team').value.trim();
    const notes        = document.getElementById('rep_notes').value.trim();
    const date = new Date().toLocaleDateString('ar-IQ', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    const branch = currentUser.branch;
    const name = currentUser.name;

    const { data: completions } = await sb
        .from('task_completions')
        .select('procedure_code')
        .eq('branch', branch)
        .eq('completion_date', todayDate);

    const doneCodes = (completions || []).map(c => c.procedure_code);
    const dailyProcs = PROCEDURES.daily;
    const completedTasks = dailyProcs.filter(p => doneCodes.includes(p.code));
    const pendingTasks   = dailyProcs.filter(p => !doneCodes.includes(p.code));

    return { sales, achievements, issues, team, notes, date, branch, name, completedTasks, pendingTasks };
}

        '<button onclick="window.print()" style="background:#0f2057;color:white;border:none;padding:14px 40px;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;">طباعة / حفظ PDF</button>',
        '</div></div></body></html>'

    win.document.close();

let currentTarget = null; // store loaded target for manager

async function toggleAchieved(ei) {
    if (!currentTarget || !currentTarget.employees) return;
    currentTarget.employees[ei].achieved = !currentTarget.employees[ei].achieved;
    const achieved = currentTarget.employees[ei].achieved;
    const btn = document.getElementById(`ach-btn-${ei}`);

        btn.closest('div').style.borderColor = achieved ? '#86efac' : '#dde3f0';

// ============ TARGETS ============
async function openTargetsModal() {
    document.getElementById('targetsModal').style.display = 'flex';
    document.getElementById('targetDate').value = todayDate;
    await renderBranchTargets(todayDate);
}

function closeTargetsModal() {
    document.getElementById('targetsModal').style.display = 'none';
}

async function renderBranchTargets(date) {
    // Load existing targets for this date
    const { data: existing } = await sb
        .from('sales_targets')
        .select('*')
        .eq('target_date', date);

    const existingMap = {};
    (existing || []).forEach(t => { existingMap[t.branch] = t; });

    let html = '';
    BRANCHES.forEach((branch, bi) => {
        const ex = existingMap[branch];
        const total = ex ? ex.total_target : '';
        const notes = ex ? (ex.notes || '') : '';
        const employees = ex ? (ex.employees || []) : [];

        // Build employee rows (min 3)
        const empCount = Math.max(employees.length, 3);
        let empRows = '';
        for (let i = 0; i < empCount; i++) {
            const emp = employees[i] || { name: '', target: '', achieved: false };
            empRows += `
            <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:center;">
                <input type="text" placeholder="اسم الموظف" value="${emp.name || ''}"
                    id="emp_name_${bi}_${i}"
                    style="padding:8px 10px;border:1.5px solid #dde3f0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;direction:rtl;">
                <input type="number" placeholder="الهدف (قطعة)" value="${emp.target || ''}"
                    id="emp_target_${bi}_${i}"
                    style="padding:8px 10px;border:1.5px solid #dde3f0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;direction:rtl;">
                <button onclick="removeEmpRow(${bi},${i})" style="background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px;width:auto;">✕</button>
            </div>`;
        }

        html += `
        <div style="background:#f8faff;border:2px solid #dde3f0;border-radius:14px;padding:18px;margin-bottom:16px;" id="branch-target-${bi}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                <div style="font-size:14px;font-weight:800;color:#0f2057;">🏪 ${branch}</div>
                ${ex ? '<div style="background:#f0fdf4;color:#16a34a;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid #86efac;">✅ هدف محفوظ</div>' : ''}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:#6b7a9e;margin-bottom:5px;">إجمالي هدف الفرع (قطعة)</label>
                    <input type="number" id="branch_total_${bi}" value="${total}" placeholder="مثال: 50"
                        style="width:100%;padding:10px 12px;border:2px solid #dde3f0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;direction:rtl;">
                </div>
                <div>
                    <label style="display:block;font-size:11px;font-weight:700;color:#6b7a9e;margin-bottom:5px;">ملاحظات / تعليمات</label>
                    <input type="text" id="branch_notes_${bi}" value="${notes}" placeholder="اختياري..."
                        style="width:100%;padding:10px 12px;border:2px solid #dde3f0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:13px;direction:rtl;">
                </div>
            </div>
            <div style="font-size:11px;font-weight:700;color:#6b7a9e;margin-bottom:8px;">توزيع الهدف على الموظفين</div>
            <div id="emp-rows-${bi}">${empRows}</div>
            <button onclick="addEmpRow(${bi})" style="background:white;border:1.5px dashed #c9a84c;color:#c9a84c;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;width:auto;margin-top:4px;">+ إضافة موظف</button>
        </div>`;
    });

    document.getElementById('branchTargetsList').innerHTML = html;
}

function addEmpRow(bi) {
    const container = document.getElementById(`emp-rows-${bi}`);
    const i = container.children.length;
    const div = document.createElement('div');
    div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:6px;align-items:center;';
    div.innerHTML = `
        <input type="text" placeholder="اسم الموظف" id="emp_name_${bi}_${i}"
            style="padding:8px 10px;border:1.5px solid #dde3f0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;direction:rtl;">
        <input type="number" placeholder="الهدف (قطعة)" id="emp_target_${bi}_${i}"
            style="padding:8px 10px;border:1.5px solid #dde3f0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;direction:rtl;">
        <button onclick="this.parentElement.remove()" style="background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:12px;width:auto;">✕</button>`;
    container.appendChild(div);
}

function removeEmpRow(bi, i) {
    const el = document.getElementById(`emp_name_${bi}_${i}`);
    if (el) el.closest('div').remove();
}

async function saveTargets() {
    const date = document.getElementById('targetDate').value;
    if (!date) { showToast('⚠️ اختر التاريخ أولاً'); return; }

    showLoading(true);
    try {
        for (let bi = 0; bi < BRANCHES.length; bi++) {
            const branch = BRANCHES[bi];
            const total = document.getElementById(`branch_total_${bi}`)?.value;
            if (!total) continue;

            const notes = document.getElementById(`branch_notes_${bi}`)?.value || '';

            // Collect employees
            const empContainer = document.getElementById(`emp-rows-${bi}`);
            const employees = [];
            if (empContainer) {
                const rows = empContainer.children;
                for (let r = 0; r < rows.length; r++) {
                    const nameEl = rows[r].querySelector('input[type="text"]');
                    const targetEl = rows[r].querySelector('input[type="number"]');
                    if (nameEl?.value.trim()) {
                        employees.push({ name: nameEl.value.trim(), target: targetEl?.value || '' });
                    }
                }
            }

            await sb.from('sales_targets').upsert({
                branch,
                target_date: date,
                total_target: parseInt(total),
                notes,
                employees,
                created_by: currentUser.email
            }, { onConflict: 'branch,target_date' });
        }
        showToast('✅ تم حفظ الأهداف بنجاح');
        closeTargetsModal();
        loadDirectorDashboard();
    } catch(e) {
        showToast('❌ خطأ في الحفظ');
        console.error(e);
    } finally {
        showLoading(false);
    }
}
